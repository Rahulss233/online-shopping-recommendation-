{% extends "admin/base_admin.html" %}
{% block title %}{{ action }} Product — Admin{% endblock %}
{% block admin_content %}

<div style="display:flex;align-items:center;gap:12px;margin-bottom:24px;">
    <a href="/admin/products" class="btn btn-outline btn-sm">← Back</a>
    <h1 style="font-family:'Syne',sans-serif;font-size:1.8rem;font-weight:800;color:var(--secondary);">{{ action }} Product</h1>
</div>

<div style="max-width:680px;">
    <div class="card">
        <form method="POST">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
                <div class="form-group" style="grid-column:1/-1;">
                    <label>Product Name *</label>
                    <input type="text" name="name" value="{{ product.name if product else '' }}" placeholder="e.g., Classic White Shirt" required>
                </div>
                <div class="form-group">
                    <label>Price (₹) *</label>
                    <input type="number" name="price" value="{{ product.price if product else '' }}" placeholder="e.g., 999" min="1" step="0.01" required>
                </div>
                <div class="form-group">
                    <label>Category *</label>
                    <select name="category" required>
                        <option value="">-- Select Category --</option>
                        {% for cat in ['Shirt', 'T-Shirt', 'Pant', 'Trousers', 'Kurtha', 'Coat'] %}
                        <option value="{{ cat }}" {{ 'selected' if product and product.category == cat else '' }}>{{ cat }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>Stock Quantity</label>
                    <input type="number" name="stock" value="{{ product.stock if product else '0' }}" min="0" placeholder="0">
                </div>
                <div class="form-group" style="grid-column:1/-1;">
                    <label>Image URL</label>
                    <input type="url" name="image" value="{{ product.image if product else '' }}"
                           placeholder="https://example.com/image.jpg"
                           id="img-url" oninput="previewImg()">
                    <img id="img-preview" src="{{ product.image if product and product.image else '' }}"
                         style="margin-top:10px;width:120px;height:90px;object-fit:cover;border-radius:var(--radius-sm);
                                border:2px solid var(--border);{{ 'display:none' if not (product and product.image) else '' }}"
                         onerror="this.style.display='none'">
                </div>
                <div class="form-group" style="grid-column:1/-1;">
                    <label>Description</label>
                    <textarea name="description" placeholder="Brief product description...">{{ product.description if product else '' }}</textarea>
                </div>
            </div>

            <div style="display:flex;gap:12px;margin-top:8px;">
                <button type="submit" class="btn btn-primary" style="padding:12px 32px;border-radius:50px;">
                    {{ '✅ Save Changes' if action == 'Edit' else '➕ Add Product' }}
                </button>
                <a href="/admin/products" class="btn btn-outline" style="padding:12px 24px;border-radius:50px;">Cancel</a>
            </div>
        </form>
    </div>
</div>

<script>
function previewImg() {
    const url = document.getElementById('img-url').value;
    const preview = document.getElementById('img-preview');
    if (url) {
        preview.src = url;
        preview.style.display = 'block';
    } else {
        preview.style.display = 'none';
    }
}
// Show preview on load if editing
window.onload = function() {
    const url = document.getElementById('img-url').value;
    if (url) document.getElementById('img-preview').style.display = 'block';
}
</script>
{% endblock %}
